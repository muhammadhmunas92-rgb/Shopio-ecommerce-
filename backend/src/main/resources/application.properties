# ===================================================================
# FORME E-COMMERCE APPLICATION CONFIGURATION
# Standalone Spring Boot Backend with H2 Database & OpenAPI / Swagger
# ===================================================================

server.port=8080
spring.application.name=forme-ecommerce-backend

# -------------------------------------------------------------------
# H2 Database Configuration (File-based for persistence across runs)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/formedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# H2 Web Console (accessible at http://localhost:8080/h2-console)
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Springdoc OpenAPI & Swagger UI Configuration
# Swagger UI URL: http://localhost:8080/swagger-ui/index.html
# OpenAPI Spec:   http://localhost:8080/v3/api-docs
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

# -------------------------------------------------------------------
# CORS Configuration (allows React frontend at http://localhost:5173)
# -------------------------------------------------------------------
forme.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
